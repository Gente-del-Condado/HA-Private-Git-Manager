name: Publicar en Mis-app

on:
  push:
    branches: [main]
    paths:
      - 'private_git_manager/**'
      - 'scripts/publish-store.sh'
      - '.github/workflows/publish-store.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-mis-app
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Gente-del-Condado/HA-Private-Git-Manager' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar la última versión de main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Descargar el catálogo de Forgejo
        env:
          DEPLOY_KEY: ${{ secrets.MIS_APP_FORGEJO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_KEY:?Falta el secreto MIS_APP_FORGEJO_DEPLOY_KEY}"
          key_dir=$(mktemp -d "$RUNNER_TEMP/catalog-ssh.XXXXXX")
          chmod 700 "$key_dir"
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > "$key_dir/key")
          unset DEPLOY_KEY
          printf '%s\n' '[gentedelcondado.es]:2233 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEV4EWbIkELBR3ba0QeSh+K7ceSXVLavPtUjRI+4kwHL' > "$key_dir/known_hosts"
          ssh_command="ssh -i '$key_dir/key' -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$key_dir/known_hosts'"
          git -c core.sshCommand="$ssh_command" clone --branch main --single-branch \
            ssh://forgejo@gentedelcondado.es:2233/wolfbelmi88/Mis-app.git store
          git -C store config core.sshCommand "$ssh_command"

      - name: Sincronizar únicamente la carpeta de la app
        run: bash source/scripts/publish-store.sh store

      - name: Publicar los cambios
        working-directory: store
        run: |
          set -euo pipefail
          git add -- private_git_manager
          if git diff --cached --quiet; then
            echo 'La tienda ya está actualizada.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SOURCE_COMMIT=$(git -C ../source rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update private_git_manager from ${SOURCE_COMMIT}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --rebase origin main
          done
          echo "Publicada private_git_manager desde ${SOURCE_COMMIT} en el catálogo Mis-app de Forgejo." >> "$GITHUB_STEP_SUMMARY"
