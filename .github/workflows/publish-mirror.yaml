name: Publicar PGM desde espejo privado
on:
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar después de validar (requiere ENABLE_MIRROR_PUBLICATION)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pgm-private-mirror
  cancel-in-progress: false
jobs:
  quality:
    if: github.repository == 'Gente-del-Condado/HA-Private-Git-Manager' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_MIRROR_PUBLICATION == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.download.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Probar el controlador
        run: python3 -m unittest discover -s .github/pgm-publication -p 'test_*.py' -v
      - name: Descargar referencias exactas del privado
        id: download
        env:
          MIRROR_READ_TOKEN: ${{ secrets.MIRROR_READ_TOKEN }}
        run: python3 .github/pgm-publication/publish_mirror.py download --source "$RUNNER_TEMP/source"
      - name: Exportar únicamente archivos revisados sin credenciales
        if: steps.download.outputs.changed == 'true'
        run: python3 .github/pgm-publication/publish_mirror.py prepare --source "$RUNNER_TEMP/source" --prepared "$RUNNER_TEMP/prepared"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: steps.download.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - name: Comprobar el producto con datos ficticios y sin credenciales
        if: steps.download.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y age openssh-server
          sudo mkdir -p /run/sshd
          for revision in main tag; do
            test -d "$RUNNER_TEMP/prepared/$revision" || continue
            cp -a "$RUNNER_TEMP/prepared/$revision" "$RUNNER_TEMP/quality-$revision"
            cd "$RUNNER_TEMP/quality-$revision"
            python -m pip install -r requirements-dev.txt
            python -m ruff check private_git_manager/app tests
            python -m ruff format --check private_git_manager/app tests
            python -m pytest --ignore-glob='tests/*_ui.py' -q
            python scripts/package.py
            bash -n scripts/install scripts/upgrade scripts/backup scripts/restore scripts/remove scripts/change_url scripts/publish-store.sh
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.download.outputs.changed == 'true'
        with:
          name: pgm-reviewed-public-files
          path: ${{ runner.temp }}/prepared/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: quality
    if: needs.quality.outputs.changed == 'true' && vars.ENABLE_MIRROR_PUBLICATION == 'true' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pgm-reviewed-public-files
          path: ${{ runner.temp }}/prepared
      - name: Verificar referencias y recibo antes de publicar
        env:
          MIRROR_READ_TOKEN: ${{ secrets.MIRROR_READ_TOKEN }}
        run: python3 .github/pgm-publication/publish_mirror.py check --prepared "$RUNNER_TEMP/prepared"
      - name: Publicar únicamente en el repositorio público de PGM
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/pgm-publication/publish_mirror.py publish --prepared "$RUNNER_TEMP/prepared"
  store:
    needs: publish
    uses: ./.github/workflows/publish-store.yaml
    secrets:
      MIS_APP_DEPLOY_KEY: ${{ secrets.MIS_APP_DEPLOY_KEY }}
  manual:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yaml
