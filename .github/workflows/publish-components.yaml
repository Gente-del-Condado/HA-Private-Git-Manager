name: Publicar en Mis-component

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/pgm_forgejo_backup/**'
      - '.github/workflows/publish-components.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-mis-component
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Gente-del-Condado/HA-Private-Git-Manager' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar las fuentes actuales
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Descargar el catálogo de Forgejo
        env:
          DEPLOY_KEY: ${{ secrets.MIS_COMPONENT_FORGEJO_DEPLOY_KEY_V2 }}
        run: |
          set -euo pipefail
          : "${DEPLOY_KEY:?Falta el secreto MIS_COMPONENT_FORGEJO_DEPLOY_KEY_V2}"
          key_dir=$(mktemp -d "$RUNNER_TEMP/catalog-ssh.XXXXXX")
          chmod 700 "$key_dir"
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > "$key_dir/key")
          unset DEPLOY_KEY
          printf '%s\n' '[gentedelcondado.es]:2233 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEV4EWbIkELBR3ba0QeSh+K7ceSXVLavPtUjRI+4kwHL' > "$key_dir/known_hosts"
          ssh_command="ssh -i '$key_dir/key' -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$key_dir/known_hosts'"
          git -c core.sshCommand="$ssh_command" clone --branch main --single-branch \
            ssh://forgejo@gentedelcondado.es:2233/wolfbelmi88/Mis-component.git catalog
          git -C catalog config core.sshCommand "$ssh_command"

      - name: Publicar únicamente pgm_forgejo_backup
        run: |
          set -euo pipefail
          component=custom_components/pgm_forgejo_backup
          jq -e '.domain == "pgm_forgejo_backup" and (.version | type == "string" and length > 0)' "source/$component/manifest.json" >/dev/null
          source_sha=$(git -C source rev-parse HEAD)
          for attempt in 1 2 3; do
            rm -rf -- "catalog/$component"
            git -C source archive "$source_sha" "$component" | tar -x -C catalog
            git -C catalog add -- "$component"
            if git -C catalog diff --cached --quiet; then
              echo 'La integración ya está actualizada.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git -C catalog -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publicar pgm_forgejo_backup desde $source_sha"
            if git -C catalog push origin HEAD:main; then
              echo "Publicada pgm_forgejo_backup desde $source_sha en Forgejo." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" != 3 ]; then
              git -C catalog fetch origin main
              git -C catalog reset --hard FETCH_HEAD
            fi
          done
          exit 1
