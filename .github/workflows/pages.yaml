name: Publicar el manual en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yaml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Gente-del-Condado/HA-Private-Git-Manager' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
