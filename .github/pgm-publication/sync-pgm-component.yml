name: Consumir componente público de PGM
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-components
  cancel-in-progress: false
jobs:
  consume:
    if: github.repository == 'Gente-del-Condado/Mis_componente_ha' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Consumir archivos y recibo públicos sin clave entre repositorios
        run: python3 .github/pgm-publication/consume_component.py
